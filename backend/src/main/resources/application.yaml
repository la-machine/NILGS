# Base configuration: production-safe defaults. Each environment profile
# (dev, test, staging, prod) overrides only what differs; EnvironmentGuard
# refuses to start unless exactly one of them is active.
spring:
  application:
    name: snigf
  # Secrets are files (Docker secrets), never environment variables or Git:
  # /run/secrets/db_app_password becomes the property db_app_password.
  config:
    import: optional:configtree:${SNIGF_SECRETS_DIR:/run/secrets}/
  datasource:
    url: ${SNIGF_DB_URL:jdbc:postgresql://localhost:47432/snigf}
    username: snigf_app
    password: ${db_app_password:}
    hikari:
      maximum-pool-size: 10
  # Migrations are applied by the migrate service as snigf_migrator (ADR-009);
  # the application role cannot run DDL.
  flyway:
    enabled: false
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true

server:
  port: 47080
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

# Health and metrics on a separate port that the reverse proxy never exposes.
management:
  server:
    port: 47081
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

# Structured JSON logs (Elastic Common Schema); the correlation id is in the MDC.
logging:
  structured:
    format:
      console: ecs

snigf:
  demo-mode: false
