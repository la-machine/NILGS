# SNIGF/NILGS - Copyright (c) 2026 FLYT.
# Author: Pythagore.
# CI: runs on every push and pull request (Baseline B, "Testing, delivery and operations").
#   backend   JDK 25, unit tests + integration tests against PostGIS (Testcontainers)
#   frontend  lint + type-check + production build
#   stack     database test suite, smoke test of the whole Compose stack (S1-AC1),
#             secret scan; same images and scripts as local development
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test (unit + integration)
        run: sh ./mvnw -B -ntp verify

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the secret scan inspects the full history

      - name: Local settings and throwaway secrets for this run
        run: bash infra/scripts/dev-setup.sh

      - name: Database tests (pgTAP + concurrent audit chain)
        run: docker compose --profile test run --rm --build dbtest

      - name: Stack smoke test (S1-AC1)
        run: |
          docker compose up -d --build --wait
          expected="$(ls backend/src/main/resources/db/migration/V*__*.sql | wc -l)"
          applied="$(docker compose exec -T db psql -X -tA -U postgres -d snigf -v ON_ERROR_STOP=1 \
            -c "SELECT count(*) FROM snigf.flyway_schema_history WHERE success")"
          echo "migrations: expected=$expected applied=$applied"
          test "$applied" -eq "$expected"
          curl -fsS http://127.0.0.1:47000/ | grep -q "SNIGF / NILGS"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:47000/api/v1/parcels)" = 403

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
