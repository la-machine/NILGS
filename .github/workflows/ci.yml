# SNIGF/NILGS - Copyright (c) 2026 FLYT.
# Author: Pythagore.
# CI: runs on every push and pull request (Baseline B, "Testing, delivery and operations").
#   backend   JDK 25, unit tests + integration tests against PostGIS (Testcontainers),
#             including the architecture, permission-matrix and documentation checks
#   frontend  lint + structure check (scripts/check-architecture.mjs) + type-check + build
#   stack     database test suite (pgTAP), smoke test of the whole Compose stack (S1-AC1),
#             security and segmentation probes, end-to-end tests in Chromium, secret scan;
#             same images and scripts as local development
# Every action is pinned to a commit (a tag can be moved); the version is in the comment.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test (unit + integration)
        run: sh ./mvnw -B -ntp verify

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint and structure check
        run: npm run lint
      - name: Component and unit tests
        run: npm test
      - name: Type-check and build
        run: npm run build

  stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the secret scan inspects the full history
          persist-credentials: false

      - name: Local settings and throwaway secrets for this run
        run: bash infra/scripts/dev-setup.sh

      - name: Database tests (pgTAP + concurrent audit chain)
        run: docker compose --profile test run --rm --build dbtest

      - name: Stack smoke test (S1-AC1)
        run: |
          # .env is data, never sourced as shell code (values may contain spaces).
          SNIGF_PUBLIC_HOSTNAME="$(sed -n 's/^SNIGF_PUBLIC_HOSTNAME=//p' .env | tr -d '\r')"
          SNIGF_HTTPS_PORT="$(sed -n 's/^SNIGF_HTTPS_PORT=//p' .env | tr -d '\r')"
          docker compose up -d --build --wait
          expected="$(ls backend/src/main/resources/db/migration/V*__*.sql | wc -l)"
          # The superuser logs in only through the local socket as the postgres OS user (pg_hba.conf).
          applied="$(docker compose exec -T -u postgres db psql -X -tA -d snigf -v ON_ERROR_STOP=1 \
            -c "SELECT count(*) FROM snigf.flyway_schema_history WHERE success")"
          echo "migrations: expected=$expected applied=$applied"
          test "$applied" -eq "$expected"
          URL="https://$SNIGF_PUBLIC_HOSTNAME:$SNIGF_HTTPS_PORT"
          curl -fsS --cacert infra/secrets/pki_root_ca_crt "$URL/" | grep -q "SNIGF / NILGS"
          test "$(curl -s -o /dev/null -w '%{http_code}' --cacert infra/secrets/pki_root_ca_crt "$URL/api/v1/parcels")" = 401

      - name: Security probe (transport, ADR-017)
        run: docker compose --profile test run --rm --build security-probe

      - name: Segmentation probe (isolation, ADR-020)
        run: docker compose --profile test run --rm segmentation-probe

      - name: End-to-end tests in Chromium (ADR-026, ADR-028)
        run: bash infra/scripts/e2e.sh

      - name: End-to-end report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: |
            e2e/out/report
            e2e/out/results
          retention-days: 7
          if-no-files-found: ignore

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v

      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
