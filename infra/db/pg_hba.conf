# Client authentication (ADR-017). First matching line wins; anything unmatched is refused.
#
# - The superuser logs in only through the local socket, as the postgres OS user
#   (`docker compose exec -u postgres db psql -d snigf`). Never over the network.
# - Application roles connect only over TLS (hostssl; ssl_min_protocol_version is
#   TLSv1.3), with BOTH a client certificate whose CN equals the role name
#   (clientcert=verify-full) and the SCRAM password.

# TYPE   DATABASE  USER            ADDRESS  METHOD
local    all       postgres                 peer
local    all       all                      reject

hostssl  snigf     snigf_app       all      scram-sha-256  clientcert=verify-full
hostssl  snigf     snigf_migrator  all      scram-sha-256  clientcert=verify-full
hostssl  snigf     snigf_auditor   all      scram-sha-256  clientcert=verify-full

host     all       all             all      reject
