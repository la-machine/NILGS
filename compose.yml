# Author: Pythagore.
# SNIGF/NILGS — local and demo stack.
#
#   bash infra/scripts/dev-setup.sh                  once: .env, passwords, development PKI
#   docker compose up -d --build --wait              db, migrate, openbao, bao-init, app, web
#                                                    → https://localhost:47000
#   docker compose --profile test run --rm --build dbtest           database test suite
#   docker compose --profile test run --rm --build security-probe   transport and isolation checks
#
# Security model (ADR-017, ADR-020):
#   * TLS 1.3 on every hop: browser → web, web → app (mutual TLS), app/migrate → db
#     (verify-full + client certificate + SCRAM). No plain-text port exists.
#   * Networks: edge (published proxy port), app-net (web ↔ app), data-net (app, migrate ↔ db),
#     key-net (app, bao-init ↔ openbao). All but edge are internal (no internet). The proxy
#     reaches neither the database nor OpenBao.
#   * The DEMO payment simulator (ADR-037) has three peers, one network each: provider-out
#     (app → payment-sim, charges), provider-in (payment-sim → web's provider listener,
#     callbacks) and provider-key (payment-sim → openbao, HMAC only). No real money moves.
#   * Keys live in OpenBao (ADR-018): the app signs, wraps data keys and computes HMACs
#     there over mutual TLS and never holds a long-term key.
#   * Containers: read-only root filesystem, all capabilities dropped, no-new-privileges,
#     non-root users, resource limits from .env.
#   * Every value comes from .env (ADR-014); Compose refuses to start if one is missing.
#   * Images are pinned by tag and digest; Compose pulls them when missing.

name: snigf

x-postgis-image: &postgis-image postgis/postgis:18-3.6@sha256:b4466ea2ba7e3af54fcbba996d45325720f4b3ecb4f43f99b2f41367dc196f23
# Map tools (ADR-029, profile "maps"); GDAL and go-pmtiles are pinned in infra/maps/Dockerfile.
x-planetiler-image: &planetiler-image ghcr.io/onthegomap/planetiler:0.10.2@sha256:cf32202dbc001a9ab4bc11534b642b13de3798179817da8558e567a3d13dd403

# Key custody settings shared by the provisioning job and the application (ADR-018).
x-key-names: &key-names
  SNIGF_BAO_TRANSIT_MOUNT: ${SNIGF_BAO_TRANSIT_MOUNT:?set in .env}
  SNIGF_BAO_AUTH_MOUNT: ${SNIGF_BAO_AUTH_MOUNT:?set in .env}
  SNIGF_BAO_APP_ROLE: ${SNIGF_BAO_APP_ROLE:?set in .env}
  SNIGF_KEY_AUDIT_CHECKPOINT: ${SNIGF_KEY_AUDIT_CHECKPOINT:?set in .env}
  SNIGF_KEY_RECORD_SIGNING: ${SNIGF_KEY_RECORD_SIGNING:?set in .env}
  SNIGF_KEY_DATA_ENCRYPTION: ${SNIGF_KEY_DATA_ENCRYPTION:?set in .env}
  SNIGF_KEY_PAYMENT_CALLBACK: ${SNIGF_KEY_PAYMENT_CALLBACK:?set in .env}
  SNIGF_KEY_PASSWORD_PEPPER: ${SNIGF_KEY_PASSWORD_PEPPER:?set in .env}
  SNIGF_KEY_BLIND_INDEX: ${SNIGF_KEY_BLIND_INDEX:?set in .env}
  SNIGF_KEY_DOCUMENT_ISSUANCE: ${SNIGF_KEY_DOCUMENT_ISSUANCE:?set in .env}

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  db:
    <<: *hardened
    image: *postgis-image
    # The entrypoint starts as root to install the TLS key and drop to the postgres
    # user; these are the only capabilities it needs for that.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    entrypoint: ["sh", "/etc/snigf/start-postgres.sh"]
    environment:
      POSTGRES_DB: snigf
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_superuser_password
      PGPORT: ${SNIGF_DB_PORT:?set in .env}
      SNIGF_DB_LOG_CONNECTIONS: ${SNIGF_DB_LOG_CONNECTIONS:?set in .env}
    secrets:
      - db_superuser_password
      - db_migrator_password
      - db_app_password
      - db_auditor_password
      - db_tls_crt
      - db_tls_key
      - pki_ca_chain_crt
    volumes:
      # PostgreSQL 18 images keep PGDATA under /var/lib/postgresql/18/docker.
      - db-data:/var/lib/postgresql
      - ./infra/db/start-postgres.sh:/etc/snigf/start-postgres.sh:ro
      - ./infra/db/pg_hba.conf:/etc/snigf/pg_hba.conf:ro
      # First start of an empty volume only.
      - ./infra/db/init/01-roles.sql:/snigf/01-roles.sql:ro
      - ./infra/db/docker-init-roles.sh:/docker-entrypoint-initdb.d/10-snigf-roles.sh:ro
    tmpfs:
      - /var/run/postgresql
      - /tmp
      - /run/snigf-tls
    networks: [data-net]
    mem_limit: ${SNIGF_DB_MEMORY:?set in .env}
    cpus: ${SNIGF_DB_CPUS:?set in .env}
    pids_limit: ${SNIGF_DB_PIDS:?set in .env}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "snigf"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Deploy-time step: applies migrations as the schema owner over TLS with a client
  # certificate, then exits. The application never holds these credentials (ADR-009).
  migrate:
    <<: *hardened
    restart: "no"
    image: flyway/flyway:12.4.0-alpine   # the Flyway version Spring Boot 4.1.1 manages, so tests and deploys match
    user: "10003:10003"
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - db_migrator_password
      - migrator_db_client_crt
      - migrator_db_client_key_pk8
      - pki_ca_chain_crt
    environment:
      FLYWAY_URL: "jdbc:postgresql://db:${SNIGF_DB_PORT:?set in .env}/snigf?sslmode=verify-full&sslrootcert=/run/secrets/pki_ca_chain_crt&sslcert=/run/secrets/migrator_db_client_crt&sslkey=/run/secrets/migrator_db_client_key_pk8"
      FLYWAY_USER: snigf_migrator
      FLYWAY_SCHEMAS: snigf
      FLYWAY_DEFAULT_SCHEMA: snigf
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
    volumes:
      - ./backend/src/main/resources/db/migration:/flyway/sql:ro
    tmpfs:
      - /tmp
    networks: [data-net]
    mem_limit: ${SNIGF_MIGRATE_MEMORY:?set in .env}
    entrypoint: ["sh", "-c", "FLYWAY_PASSWORD=\"$$(cat /run/secrets/db_migrator_password)\" exec flyway migrate"]

  # Key custody (ADR-018). Starts sealed; bao-init unseals and provisions it.
  openbao:
    <<: *hardened
    build:
      context: infra/openbao
      target: server
    image: snigf-openbao:local
    environment:
      SNIGF_BAO_PORT: ${SNIGF_BAO_PORT:?set in .env}
      SNIGF_BAO_CLUSTER_PORT: ${SNIGF_BAO_CLUSTER_PORT:?set in .env}
      SNIGF_BAO_LOG_LEVEL: ${SNIGF_BAO_LOG_LEVEL:?set in .env}
      # Used only by the health check (`bao status`): healthy = initialised and unsealed.
      BAO_ADDR: https://127.0.0.1:${SNIGF_BAO_PORT:?set in .env}
      BAO_CACERT: /run/secrets/pki_ca_chain_crt
      BAO_CLIENT_CERT: /run/secrets/bao_health_client_crt
      BAO_CLIENT_KEY: /run/secrets/bao_health_client_key
    secrets:
      - bao_tls_crt
      - bao_tls_key
      - pki_ca_chain_crt
      - bao_health_client_crt
      - bao_health_client_key
    volumes:
      - bao-data:/openbao/data
      - bao-audit:/openbao/audit
    tmpfs:
      - /run/snigf-bao:uid=100,gid=1000,mode=0700
      - /tmp
    networks: [key-net, provider-key]
    mem_limit: ${SNIGF_BAO_MEMORY:?set in .env}
    cpus: ${SNIGF_BAO_CPUS:?set in .env}
    pids_limit: ${SNIGF_BAO_PIDS:?set in .env}
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Deploy-time step: initialise (first run), unseal, and provision keys, policy and the
  # application's certificate login with a temporary root token it then revokes.
  bao-init:
    <<: *hardened
    restart: "no"
    build:
      context: infra/openbao
      target: init
    image: snigf-openbao-init:local
    depends_on:
      openbao:
        condition: service_started
    environment:
      <<: *key-names
      SNIGF_BAO_PORT: ${SNIGF_BAO_PORT:?set in .env}
      SNIGF_BAO_UNSEAL_SHARES: ${SNIGF_BAO_UNSEAL_SHARES:?set in .env}
      SNIGF_BAO_UNSEAL_THRESHOLD: ${SNIGF_BAO_UNSEAL_THRESHOLD:?set in .env}
      SNIGF_BAO_INIT_TIMEOUT: ${SNIGF_BAO_INIT_TIMEOUT:?set in .env}
      SNIGF_BAO_APP_CLIENT_CN: ${SNIGF_BAO_APP_CLIENT_CN:?set in .env}
      SNIGF_BAO_TOKEN_TTL: ${SNIGF_BAO_TOKEN_TTL:?set in .env}
      SNIGF_BAO_TOKEN_MAX_TTL: ${SNIGF_BAO_TOKEN_MAX_TTL:?set in .env}
      SNIGF_KEY_ROTATE_SIGNING: ${SNIGF_KEY_ROTATE_SIGNING:?set in .env}
      SNIGF_KEY_ROTATE_DATA_ENCRYPTION: ${SNIGF_KEY_ROTATE_DATA_ENCRYPTION:?set in .env}
      SNIGF_KEY_ROTATE_PAYMENT_CALLBACK: ${SNIGF_KEY_ROTATE_PAYMENT_CALLBACK:?set in .env}
      SNIGF_BAO_PAYMENT_SIM_ROLE: ${SNIGF_BAO_PAYMENT_SIM_ROLE:?set in .env}
      SNIGF_PAYMENT_SIM_CLIENT_CN: ${SNIGF_PAYMENT_SIM_CLIENT_CN:?set in .env}
    secrets:
      - pki_ca_chain_crt
      - bao_admin_client_crt
      - bao_admin_client_key
    volumes:
      # DEVELOPMENT CUSTODY ONLY: unseal shares stand in for the custodians (ADR-018).
      - bao-keys:/bao-keys
    tmpfs:
      - /tmp
    networks: [key-net]

  app:
    <<: *hardened
    build: ./backend
    image: snigf-backend:local
    depends_on:
      migrate:
        condition: service_completed_successfully
      bao-init:
        condition: service_completed_successfully
      openbao:
        condition: service_healthy
    environment:
      <<: *key-names
      SNIGF_BAO_URL: https://openbao:${SNIGF_BAO_PORT:?set in .env}
      SNIGF_BAO_CONNECT_TIMEOUT: ${SNIGF_BAO_CONNECT_TIMEOUT:?set in .env}
      SNIGF_BAO_REQUEST_TIMEOUT: ${SNIGF_BAO_REQUEST_TIMEOUT:?set in .env}
      SPRING_PROFILES_ACTIVE: ${SNIGF_PROFILE:?set in .env}
      SNIGF_DB_URL: jdbc:postgresql://db:${SNIGF_DB_PORT:?set in .env}/snigf
      SNIGF_APP_PORT: ${SNIGF_APP_PORT:?set in .env}
      SNIGF_MANAGEMENT_PORT: ${SNIGF_MANAGEMENT_PORT:?set in .env}
      SNIGF_PROXY_CLIENT_CN: ${SNIGF_PROXY_CLIENT_CN:?set in .env}
      SNIGF_PROXY_CLIENT_ADDRESS_HEADER: ${SNIGF_PROXY_CLIENT_ADDRESS_HEADER:?set in .env}
      SNIGF_PASSWORD_MIN_LENGTH: ${SNIGF_PASSWORD_MIN_LENGTH:?set in .env}
      SNIGF_PASSWORD_MAX_LENGTH: ${SNIGF_PASSWORD_MAX_LENGTH:?set in .env}
      SNIGF_PASSWORD_ARGON2_MEMORY_KIB: ${SNIGF_PASSWORD_ARGON2_MEMORY_KIB:?set in .env}
      SNIGF_PASSWORD_ARGON2_ITERATIONS: ${SNIGF_PASSWORD_ARGON2_ITERATIONS:?set in .env}
      SNIGF_PASSWORD_ARGON2_PARALLELISM: ${SNIGF_PASSWORD_ARGON2_PARALLELISM:?set in .env}
      SNIGF_PASSWORD_MAX_CONCURRENT_HASHES: ${SNIGF_PASSWORD_MAX_CONCURRENT_HASHES:?set in .env}
      SNIGF_PASSWORD_HASH_QUEUE_TIMEOUT: ${SNIGF_PASSWORD_HASH_QUEUE_TIMEOUT:?set in .env}
      SNIGF_LOGIN_MAX_FAILURES: ${SNIGF_LOGIN_MAX_FAILURES:?set in .env}
      SNIGF_LOGIN_LOCK_DURATION: ${SNIGF_LOGIN_LOCK_DURATION:?set in .env}
      SNIGF_RATE_LOGIN_PER_MINUTE: ${SNIGF_RATE_LOGIN_PER_MINUTE:?set in .env}
      SNIGF_RATE_REGISTER_PER_HOUR: ${SNIGF_RATE_REGISTER_PER_HOUR:?set in .env}
      SNIGF_RATE_MAX_TRACKED_CLIENTS: ${SNIGF_RATE_MAX_TRACKED_CLIENTS:?set in .env}
      SNIGF_SESSION_IDLE_TIMEOUT: ${SNIGF_SESSION_IDLE_TIMEOUT:?set in .env}
      SNIGF_SESSION_ABSOLUTE_TIMEOUT: ${SNIGF_SESSION_ABSOLUTE_TIMEOUT:?set in .env}
      SNIGF_SESSION_COOKIE_NAME: ${SNIGF_SESSION_COOKIE_NAME:?set in .env}
      SNIGF_SESSION_COOKIE_SAME_SITE: ${SNIGF_SESSION_COOKIE_SAME_SITE:?set in .env}
      SNIGF_SESSION_CLEANUP_CRON: ${SNIGF_SESSION_CLEANUP_CRON:?set in .env}
      SNIGF_CSRF_COOKIE_NAME: ${SNIGF_CSRF_COOKIE_NAME:?set in .env}
      SNIGF_CSRF_HEADER_NAME: ${SNIGF_CSRF_HEADER_NAME:?set in .env}
      SNIGF_WEBAUTHN_RP_ID: ${SNIGF_WEBAUTHN_RP_ID:?set in .env}
      SNIGF_WEBAUTHN_RP_NAME: ${SNIGF_WEBAUTHN_RP_NAME:?set in .env}
      SNIGF_WEBAUTHN_ORIGINS: ${SNIGF_WEBAUTHN_ORIGINS:?set in .env}
      SNIGF_WEBAUTHN_TIMEOUT: ${SNIGF_WEBAUTHN_TIMEOUT:?set in .env}
      SNIGF_WEBAUTHN_ATTESTATION: ${SNIGF_WEBAUTHN_ATTESTATION:?set in .env}
      SNIGF_WEBAUTHN_MIN_AUTHENTICATORS: ${SNIGF_WEBAUTHN_MIN_AUTHENTICATORS:?set in .env}
      SNIGF_MFA_RECOVERY_CODES: ${SNIGF_MFA_RECOVERY_CODES:?set in .env}
      SNIGF_ADMIN_REQUEST_TTL: ${SNIGF_ADMIN_REQUEST_TTL:?set in .env}
      SNIGF_PARCEL_REFERENCE_ZONE: ${SNIGF_PARCEL_REFERENCE_ZONE:?set in .env}
      SNIGF_PARCEL_PAGE_SIZE: ${SNIGF_PARCEL_PAGE_SIZE:?set in .env}
      SNIGF_CONFLICT_MIN_OVERLAP_M2: ${SNIGF_CONFLICT_MIN_OVERLAP_M2:?set in .env}
      SNIGF_CONFLICT_DUPLICATE_SHARE: ${SNIGF_CONFLICT_DUPLICATE_SHARE:?set in .env}
      SNIGF_APPLICATION_TYPES: ${SNIGF_APPLICATION_TYPES:?set in .env}
      SNIGF_APPLICATION_REFERENCE_ZONE: ${SNIGF_APPLICATION_REFERENCE_ZONE:?set in .env}
      SNIGF_APPLICATION_PAGE_SIZE: ${SNIGF_APPLICATION_PAGE_SIZE:?set in .env}
      SNIGF_APPLICATION_MAX_DRAFTS: ${SNIGF_APPLICATION_MAX_DRAFTS:?set in .env}
      SNIGF_REPORTING_TARGET_COMPLETENESS_REVIEW: ${SNIGF_REPORTING_TARGET_COMPLETENESS_REVIEW:?set in .env}
      SNIGF_REPORTING_TARGET_INFO_REQUESTED: ${SNIGF_REPORTING_TARGET_INFO_REQUESTED:?set in .env}
      SNIGF_REPORTING_TARGET_UNDER_REVIEW: ${SNIGF_REPORTING_TARGET_UNDER_REVIEW:?set in .env}
      SNIGF_REPORTING_TARGET_PENDING_DECISION: ${SNIGF_REPORTING_TARGET_PENDING_DECISION:?set in .env}
      SNIGF_REPORTING_DURATION_WINDOW: ${SNIGF_REPORTING_DURATION_WINDOW:?set in .env}
      SNIGF_REPORTING_PAGE_SIZE: ${SNIGF_REPORTING_PAGE_SIZE:?set in .env}
      # Simulated payment (ADR-037): no real money moves.
      # Documents issued by SNIGF (ADR-039).
      SNIGF_REGISTER_LOCK_REVIEW_AFTER: ${SNIGF_REGISTER_LOCK_REVIEW_AFTER:?set in .env}
      SNIGF_REGISTER_OVERDUE_CRON: ${SNIGF_REGISTER_OVERDUE_CRON:?set in .env}
      SNIGF_REGISTER_PAGE_SIZE: ${SNIGF_REGISTER_PAGE_SIZE:?set in .env}
      SNIGF_ISSUANCE_VERIFY_BASE_URL: ${SNIGF_ISSUANCE_VERIFY_BASE_URL:?set in .env}
      SNIGF_ISSUANCE_MAX_UPLOAD_BYTES: ${SNIGF_ISSUANCE_MAX_UPLOAD_BYTES:?set in .env}
      SNIGF_RATE_VERIFY_PER_MINUTE: ${SNIGF_RATE_VERIFY_PER_MINUTE:?set in .env}
      SNIGF_ISSUANCE_PAGE_SIZE: ${SNIGF_ISSUANCE_PAGE_SIZE:?set in .env}
      SNIGF_PAYMENT_FEES: ${SNIGF_PAYMENT_FEES:?set in .env}
      SNIGF_PAYMENT_REQUIRED_BEFORE_ACCEPTANCE: ${SNIGF_PAYMENT_REQUIRED_BEFORE_ACCEPTANCE:?set in .env}
      SNIGF_PAYMENT_PENDING_TTL: ${SNIGF_PAYMENT_PENDING_TTL:?set in .env}
      SNIGF_PAYMENT_PROVIDER: ${SNIGF_PAYMENT_PROVIDER:?set in .env}
      SNIGF_PAYMENT_CALLBACK_MAX_SKEW: ${SNIGF_PAYMENT_CALLBACK_MAX_SKEW:?set in .env}
      SNIGF_PAYMENT_PROVIDER_CLIENT_CNS: ${SNIGF_PAYMENT_PROVIDER_CLIENT_CNS:?set in .env}
      SNIGF_PROXY_PROVIDER_CLIENT_HEADER: ${SNIGF_PROXY_PROVIDER_CLIENT_HEADER:?set in .env}
      SNIGF_PAYMENT_EXPIRY_CRON: ${SNIGF_PAYMENT_EXPIRY_CRON:?set in .env}
      SNIGF_PAYMENT_PAGE_SIZE: ${SNIGF_PAYMENT_PAGE_SIZE:?set in .env}
      SNIGF_PAYMENT_SIMULATOR_URL: https://payment-sim:${SNIGF_PAYMENT_SIM_PORT:?set in .env}
      SNIGF_PAYMENT_SIMULATOR_CONNECT_TIMEOUT: ${SNIGF_PAYMENT_SIMULATOR_CONNECT_TIMEOUT:?set in .env}
      SNIGF_PAYMENT_SIMULATOR_REQUEST_TIMEOUT: ${SNIGF_PAYMENT_SIMULATOR_REQUEST_TIMEOUT:?set in .env}
      # Documents (ADR-033): the volume document-data, mounted into the app only.
      SNIGF_DOCUMENT_DIRECTORY: /var/lib/snigf/documents
      SNIGF_DOCUMENT_MAX_BYTES: ${SNIGF_DOCUMENT_MAX_BYTES:?set in .env}
      SNIGF_DOCUMENT_MAX_VERSIONS: ${SNIGF_DOCUMENT_MAX_VERSIONS:?set in .env}
      SNIGF_DOCUMENT_MAX_PIXELS: ${SNIGF_DOCUMENT_MAX_PIXELS:?set in .env}
      SNIGF_DOCUMENT_ORPHAN_GRACE: ${SNIGF_DOCUMENT_ORPHAN_GRACE:?set in .env}
      SNIGF_DOCUMENT_CLEANUP_CRON: ${SNIGF_DOCUMENT_CLEANUP_CRON:?set in .env}
      SNIGF_PROXY_MAX_BODY_BYTES: ${SNIGF_PROXY_MAX_BODY_BYTES:?set in .env}
      # Map data: the read-only volume map-data (ADR-029), filled by the maps tools.
      SNIGF_MAP_DATA_DIRECTORY: /maps
      SNIGF_MAP_EXTERNAL_PROVIDERS: ${SNIGF_MAP_EXTERNAL_PROVIDERS:?set in .env}
      SNIGF_AUDIT_CHECKPOINT_CRON: ${SNIGF_AUDIT_CHECKPOINT_CRON:?set in .env}
      SNIGF_AUDIT_VERIFY_CRON: ${SNIGF_AUDIT_VERIFY_CRON:?set in .env}
      SNIGF_AUDIT_SCHEDULE_ZONE: ${SNIGF_AUDIT_SCHEDULE_ZONE:?set in .env}
      SNIGF_AUDIT_VERIFY_ON_STARTUP: ${SNIGF_AUDIT_VERIFY_ON_STARTUP:?set in .env}
      SNIGF_AUDIT_MAX_DETAILS_BYTES: ${SNIGF_AUDIT_MAX_DETAILS_BYTES:?set in .env}
      SNIGF_AUDIT_VERIFY_FETCH_SIZE: ${SNIGF_AUDIT_VERIFY_FETCH_SIZE:?set in .env}
    # Only the application's own credentials; never the migrator's (ADR-009).
    secrets:
      - db_app_password
      - app_db_client_crt
      - app_db_client_key_pk8
      - app_tls_crt
      - app_tls_key
      - app_bao_client_crt
      - app_bao_client_key
      - app_provider_client_crt
      - app_provider_client_key
      - pki_ca_chain_crt
    tmpfs:
      - /tmp
      - /run/snigf-keys:uid=10001,gid=10001,mode=0700
    # Signed audit checkpoints (ADR-007): mounted into the app only, never into the
    # database container, so whoever controls the database cannot rewrite them.
    volumes:
      - audit-checkpoints:/var/lib/snigf/audit-checkpoints
      # Map data (ADR-029): read-only for the application; written only by the maps tools.
      - map-data:/maps:ro
      # Documents (ADR-033): the application's alone; no other container mounts it.
      - document-data:/var/lib/snigf/documents
    networks: [app-net, data-net, key-net, provider-out]
    mem_limit: ${SNIGF_APP_MEMORY:?set in .env}
    cpus: ${SNIGF_APP_CPUS:?set in .env}
    pids_limit: ${SNIGF_APP_PIDS:?set in .env}
    # Health check: backend/Dockerfile (readiness on the loopback management port).

  web:
    <<: *hardened
    build:
      context: .
      dockerfile: infra/proxy/Dockerfile
    image: snigf-web:local
    user: "10002:10002"
    depends_on:
      app:
        condition: service_healthy
    environment:
      SNIGF_HTTPS_PORT: ${SNIGF_HTTPS_PORT:?set in .env}
      SNIGF_APP_PORT: ${SNIGF_APP_PORT:?set in .env}
      SNIGF_PROXY_CLIENT_ADDRESS_HEADER: ${SNIGF_PROXY_CLIENT_ADDRESS_HEADER:?set in .env}
      SNIGF_PROXY_MAX_BODY_BYTES: ${SNIGF_PROXY_MAX_BODY_BYTES:?set in .env}
      SNIGF_PROVIDER_CALLBACK_PORT: ${SNIGF_PROVIDER_CALLBACK_PORT:?set in .env}
      SNIGF_PROXY_PROVIDER_CLIENT_HEADER: ${SNIGF_PROXY_PROVIDER_CLIENT_HEADER:?set in .env}
    secrets:
      - web_tls_crt
      - web_tls_key
      - web_client_crt
      - web_client_key
      - web_provider_tls_crt
      - web_provider_tls_key
      - pki_ca_chain_crt
    tmpfs:
      - /data:uid=10002,gid=10002,mode=0700
      - /config:uid=10002,gid=10002,mode=0700
    ports:
      - "127.0.0.1:${SNIGF_HTTPS_PORT:?set in .env}:${SNIGF_HTTPS_PORT:?set in .env}"
    networks: [edge, app-net, provider-in]
    mem_limit: ${SNIGF_WEB_MEMORY:?set in .env}
    cpus: ${SNIGF_WEB_CPUS:?set in .env}
    pids_limit: ${SNIGF_WEB_PIDS:?set in .env}

  # DEMO payment simulator (ADR-037). NO REAL MONEY MOVES. Takes charges from the app only
  # (mutual TLS, the app's provider-client certificate), signs callbacks with the callback key
  # inside OpenBao (its own login, HMAC only) and sends them through the proxy's provider
  # listener. It never reaches the database; the app, which calls it on provider-out, refuses
  # its certificate (only the proxy's is admitted), so callbacks come in through the proxy only.
  payment-sim:
    <<: *hardened
    build: infra/payment-sim
    image: snigf-payment-sim:local
    depends_on:
      bao-init:
        condition: service_completed_successfully
      openbao:
        condition: service_healthy
    environment:
      SNIGF_PAYMENT_SIM_PORT: ${SNIGF_PAYMENT_SIM_PORT:?set in .env}
      SNIGF_PAYMENT_APP_CLIENT_CN: ${SNIGF_PAYMENT_APP_CLIENT_CN:?set in .env}
      SNIGF_PAYMENT_SIM_CALLBACK_URL: https://web:${SNIGF_PROVIDER_CALLBACK_PORT:?set in .env}/api/v1/payments/callbacks/demo-simulator
      SNIGF_PAYMENT_SIM_CALLBACK_DELAY_MS: ${SNIGF_PAYMENT_SIM_CALLBACK_DELAY_MS:?set in .env}
      SNIGF_BAO_URL: https://openbao:${SNIGF_BAO_PORT:?set in .env}
      SNIGF_BAO_AUTH_MOUNT: ${SNIGF_BAO_AUTH_MOUNT:?set in .env}
      SNIGF_BAO_PAYMENT_SIM_ROLE: ${SNIGF_BAO_PAYMENT_SIM_ROLE:?set in .env}
      SNIGF_BAO_TRANSIT_MOUNT: ${SNIGF_BAO_TRANSIT_MOUNT:?set in .env}
      SNIGF_KEY_PAYMENT_CALLBACK: ${SNIGF_KEY_PAYMENT_CALLBACK:?set in .env}
    secrets:
      - payment_sim_tls_crt
      - payment_sim_tls_key
      - payment_sim_client_crt
      - payment_sim_client_key
      - pki_ca_chain_crt
    tmpfs:
      - /tmp
    networks: [provider-out, provider-in, provider-key]
    mem_limit: ${SNIGF_PAYMENT_SIM_MEMORY:?set in .env}
    cpus: ${SNIGF_PAYMENT_SIM_CPUS:?set in .env}
    pids_limit: ${SNIGF_PAYMENT_SIM_PIDS:?set in .env}
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(Number(process.env.SNIGF_PAYMENT_SIM_PORT),'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- Test harnesses (profile "test") --------------------------------------------

  # Database test suite (pgTAP + concurrent audit chain) in a throwaway server.
  # Same script and image as CI; no volume and no network, so every run starts clean.
  dbtest:
    profiles: ["test"]
    build:
      context: infra/db
      dockerfile: test.Dockerfile
      args:
        BASE_IMAGE: *postgis-image
    environment:
      PGPORT: ${SNIGF_DB_PORT:?set in .env}
    volumes:
      - .:/repo:ro
    tmpfs:
      - /var/lib/postgresql
    network_mode: none
    command: ["sh", "/repo/infra/db/run-db-test.sh"]

  # Asserts the transport and isolation guarantees against the running stack (ADR-020).
  security-probe:
    profiles: ["test"]
    build: infra/probe
    image: snigf-probe:local
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      SNIGF_HTTPS_PORT: ${SNIGF_HTTPS_PORT:?set in .env}
      SNIGF_APP_PORT: ${SNIGF_APP_PORT:?set in .env}
      SNIGF_MANAGEMENT_PORT: ${SNIGF_MANAGEMENT_PORT:?set in .env}
      SNIGF_DB_PORT: ${SNIGF_DB_PORT:?set in .env}
      SNIGF_PUBLIC_HOSTNAME: ${SNIGF_PUBLIC_HOSTNAME:?set in .env}
      SNIGF_BAO_PORT: ${SNIGF_BAO_PORT:?set in .env}
      SNIGF_BAO_TRANSIT_MOUNT: ${SNIGF_BAO_TRANSIT_MOUNT:?set in .env}
      SNIGF_BAO_AUTH_MOUNT: ${SNIGF_BAO_AUTH_MOUNT:?set in .env}
      SNIGF_BAO_APP_ROLE: ${SNIGF_BAO_APP_ROLE:?set in .env}
      SNIGF_KEY_AUDIT_CHECKPOINT: ${SNIGF_KEY_AUDIT_CHECKPOINT:?set in .env}
      SNIGF_KEY_DATA_ENCRYPTION: ${SNIGF_KEY_DATA_ENCRYPTION:?set in .env}
      SNIGF_KEY_PASSWORD_PEPPER: ${SNIGF_KEY_PASSWORD_PEPPER:?set in .env}
      SNIGF_KEY_RECORD_SIGNING: ${SNIGF_KEY_RECORD_SIGNING:?set in .env}
      SNIGF_KEY_DOCUMENT_ISSUANCE: ${SNIGF_KEY_DOCUMENT_ISSUANCE:?set in .env}
      SNIGF_CSRF_COOKIE_NAME: ${SNIGF_CSRF_COOKIE_NAME:?set in .env}
      SNIGF_CSRF_HEADER_NAME: ${SNIGF_CSRF_HEADER_NAME:?set in .env}
      SNIGF_PROVIDER_CALLBACK_PORT: ${SNIGF_PROVIDER_CALLBACK_PORT:?set in .env}
      SNIGF_BAO_PAYMENT_SIM_ROLE: ${SNIGF_BAO_PAYMENT_SIM_ROLE:?set in .env}
      SNIGF_KEY_PAYMENT_CALLBACK: ${SNIGF_KEY_PAYMENT_CALLBACK:?set in .env}
    secrets:
      - pki_ca_chain_crt
      - app_bao_client_crt
      - app_bao_client_key
      - web_client_crt
      - web_client_key
      - payment_sim_client_crt
      - payment_sim_client_key
      - db_app_password
      - app_db_client_crt
      - app_db_client_key
      - migrator_db_client_crt
      - migrator_db_client_key
    volumes:
      - ./infra/probe/security-probe.sh:/probe/security-probe.sh:ro
    tmpfs:
      - /tmp
    networks: [app-net, data-net, key-net, provider-in]
    command: ["sh", "/probe/security-probe.sh"]

  # The secret scan CI runs (gitleaks), over the whole git history, offline and read-only.
  secret-scan:
    profiles: ["test"]
    image: ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    environment:
      # The repository is owned by the host user; let git read it.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    volumes:
      - .:/repo:ro
    tmpfs:
      - /tmp
    command: ["git", "/repo", "--redact", "--verbose", "--no-banner"]

  # Runs on app-net only, like the proxy, and must not reach the database.
  segmentation-probe:
    profiles: ["test"]
    image: snigf-probe:local
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      SNIGF_DB_PORT: ${SNIGF_DB_PORT:?set in .env}
      SNIGF_BAO_PORT: ${SNIGF_BAO_PORT:?set in .env}
    volumes:
      - ./infra/probe/security-probe.sh:/probe/security-probe.sh:ro
    networks: [app-net]
    command: ["sh", "/probe/security-probe.sh", "segmentation"]

  # --- End-to-end tests (profile "e2e") ---------------------------------------------

  # Chromium against the running stack (run with infra/scripts/e2e.sh). It shares the
  # proxy's network namespace, so the browser opens https://localhost:<SNIGF_HTTPS_PORT>,
  # the origin WebAuthn credentials are bound to; it trusts the development CA, never
  # ignores certificate errors, and writes only to /tmp and e2e/out.
  e2e:
    profiles: ["e2e"]
    build: e2e
    image: snigf-e2e:local
    network_mode: "service:web"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      E2E_BASE_URL: https://${SNIGF_PUBLIC_HOSTNAME:?set in .env}:${SNIGF_HTTPS_PORT:?set in .env}
      # The office dev-make-staff.sh assigns roles at.
      E2E_OFFICE: DEMO1
      HOME: /tmp/home
    secrets:
      - pki_ca_chain_crt
    tmpfs:
      - /tmp:mode=1777
    shm_size: ${SNIGF_E2E_SHM:?set in .env}
    volumes:
      - ./e2e/out:/out
    mem_limit: ${SNIGF_E2E_MEMORY:?set in .env}
    cpus: ${SNIGF_E2E_CPUS:?set in .env}
    pids_limit: ${SNIGF_E2E_PIDS:?set in .env}

  # --- Map data tools (profile "maps", ADR-029) ---------------------------------------
  # Throwaway jobs run by infra/scripts/maps-*.sh, never part of the running stack. Only the
  # two fetch jobs have a network, and they write only the sources volume; building and
  # importing run without network; maps-install alone writes map-data. Volumes are mounted
  # with nocopy: an empty volume must keep the owner maps-install gave it, not the image's.

  maps-tools:
    profiles: ["maps"]
    build: infra/maps
    image: snigf-maps-tools:local
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    volumes:
      - {type: volume, source: map-sources, target: /sources, read_only: true, volume: {nocopy: true}}
      - {type: volume, source: map-work, target: /work, volume: {nocopy: true}}
      - ${SNIGF_MAPS_IMPORT_DIRECTORY:?set in .env}:/import:ro
    tmpfs:
      - /tmp
    mem_limit: ${SNIGF_MAPS_MEMORY:?set in .env}
    cpus: ${SNIGF_MAPS_CPUS:?set in .env}
    pids_limit: ${SNIGF_MAPS_PIDS:?set in .env}

  # Downloads the label glyph archive (pinned by SHA-256) into the sources volume.
  maps-fetch:
    profiles: ["maps"]
    image: snigf-maps-tools:local
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      SNIGF_MAPS_FONTS_URL: ${SNIGF_MAPS_FONTS_URL:?set in .env}
      SNIGF_MAPS_FONTS_SHA256: ${SNIGF_MAPS_FONTS_SHA256:?set in .env}
      SNIGF_MAPS_SATELLITE_COUNTRY: ${SNIGF_MAPS_SATELLITE_COUNTRY:?set in .env}
      SNIGF_MAPS_SATELLITE_BUFFER_KM: ${SNIGF_MAPS_SATELLITE_BUFFER_KM:?set in .env}
      SNIGF_MAPS_SATELLITE_FIRST_PLACES: ${SNIGF_MAPS_SATELLITE_FIRST_PLACES-}
      SNIGF_MAPS_SENTINEL_STAC_URL: ${SNIGF_MAPS_SENTINEL_STAC_URL:?set in .env}
      SNIGF_MAPS_SENTINEL_TOKEN_URL: ${SNIGF_MAPS_SENTINEL_TOKEN_URL-}
      SNIGF_MAPS_SENTINEL_FROM: ${SNIGF_MAPS_SENTINEL_FROM:?set in .env}
      SNIGF_MAPS_SENTINEL_TO: ${SNIGF_MAPS_SENTINEL_TO-}
      SNIGF_MAPS_SENTINEL_MAX_CLOUD: ${SNIGF_MAPS_SENTINEL_MAX_CLOUD:?set in .env}
      SNIGF_MAPS_SENTINEL_MAX_SCENES: ${SNIGF_MAPS_SENTINEL_MAX_SCENES:?set in .env}
      SNIGF_MAPS_SENTINEL_TILES: ${SNIGF_MAPS_SENTINEL_TILES-}
      SNIGF_MAPS_AERIAL_CATALOGUE_URL: ${SNIGF_MAPS_AERIAL_CATALOGUE_URL:?set in .env}
      SNIGF_MAPS_AERIAL_IMAGES: ${SNIGF_MAPS_AERIAL_IMAGES-}
      SNIGF_MAPS_AERIAL_LICENCES: ${SNIGF_MAPS_AERIAL_LICENCES:?set in .env}
    volumes:
      - {type: volume, source: map-sources, target: /sources, volume: {nocopy: true}}
    tmpfs:
      - /tmp
    networks: [maps-egress]
    mem_limit: ${SNIGF_MAPS_MEMORY:?set in .env}
    cpus: ${SNIGF_MAPS_CPUS:?set in .env}
    pids_limit: ${SNIGF_MAPS_PIDS:?set in .env}

  # Planetiler downloads the OpenStreetMap extract, water polygons and Natural Earth.
  planetiler-fetch:
    profiles: ["maps"]
    image: *planetiler-image
    user: "10003:10003"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      JAVA_TOOL_OPTIONS: -Xmx${SNIGF_MAPS_JAVA_HEAP:?set in .env}
    # Planetiler writes data/tmp relative to its working directory.
    working_dir: /sources
    volumes:
      - {type: volume, source: map-sources, target: /sources, volume: {nocopy: true}}
    tmpfs:
      - /tmp
    networks: [maps-egress]
    mem_limit: ${SNIGF_MAPS_MEMORY:?set in .env}
    cpus: ${SNIGF_MAPS_CPUS:?set in .env}
    pids_limit: ${SNIGF_MAPS_PIDS:?set in .env}

  # Planetiler builds the vector tiles (OpenMapTiles schema) offline from those sources.
  planetiler:
    profiles: ["maps"]
    image: *planetiler-image
    user: "10003:10003"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    environment:
      # SQLite (Natural Earth) unpacks a native library: into the build volume, since /tmp is
      # mounted without execute rights.
      JAVA_TOOL_OPTIONS: -Xmx${SNIGF_MAPS_JAVA_HEAP:?set in .env} -Dorg.sqlite.tmpdir=/work/tmp
    working_dir: /work
    volumes:
      - {type: volume, source: map-sources, target: /sources, read_only: true, volume: {nocopy: true}}
      - {type: volume, source: map-work, target: /work, volume: {nocopy: true}}
    tmpfs:
      - /tmp
    mem_limit: ${SNIGF_MAPS_MEMORY:?set in .env}
    cpus: ${SNIGF_MAPS_CPUS:?set in .env}
    pids_limit: ${SNIGF_MAPS_PIDS:?set in .env}

  # The only writer of map-data: publishes a staged directory (infra/maps/install.sh).
  maps-install:
    profiles: ["maps"]
    image: snigf-maps-tools:local
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    volumes:
      - {type: volume, source: map-sources, target: /sources, volume: {nocopy: true}}
      - {type: volume, source: map-work, target: /work, volume: {nocopy: true}}
      - {type: volume, source: map-data, target: /maps, volume: {nocopy: true}}
    entrypoint: ["bash", "/opt/snigf-maps/install.sh"]
    mem_limit: ${SNIGF_MAPS_MEMORY:?set in .env}
    cpus: ${SNIGF_MAPS_CPUS:?set in .env}
    pids_limit: ${SNIGF_MAPS_PIDS:?set in .env}

networks:
  edge: {}
  # Internet access for the map fetch jobs only (profile "maps").
  maps-egress: {}
  app-net:
    internal: true
  data-net:
    internal: true
  key-net:
    internal: true
  # DEMO payment simulator (ADR-037): one network per peer.
  provider-out:
    internal: true
  provider-in:
    internal: true
  provider-key:
    internal: true

secrets:
  db_superuser_password:      {file: ./infra/secrets/db_superuser_password}
  db_migrator_password:       {file: ./infra/secrets/db_migrator_password}
  db_app_password:            {file: ./infra/secrets/db_app_password}
  db_auditor_password:        {file: ./infra/secrets/db_auditor_password}
  pki_ca_chain_crt:           {file: ./infra/secrets/pki_ca_chain_crt}
  web_tls_crt:                {file: ./infra/secrets/web_tls_crt}
  web_tls_key:                {file: ./infra/secrets/web_tls_key}
  web_client_crt:             {file: ./infra/secrets/web_client_crt}
  web_client_key:             {file: ./infra/secrets/web_client_key}
  app_tls_crt:                {file: ./infra/secrets/app_tls_crt}
  app_tls_key:                {file: ./infra/secrets/app_tls_key}
  db_tls_crt:                 {file: ./infra/secrets/db_tls_crt}
  db_tls_key:                 {file: ./infra/secrets/db_tls_key}
  app_db_client_crt:          {file: ./infra/secrets/app_db_client_crt}
  app_db_client_key:          {file: ./infra/secrets/app_db_client_key}
  app_db_client_key_pk8:      {file: ./infra/secrets/app_db_client_key_pk8}
  migrator_db_client_crt:     {file: ./infra/secrets/migrator_db_client_crt}
  migrator_db_client_key:     {file: ./infra/secrets/migrator_db_client_key}
  migrator_db_client_key_pk8: {file: ./infra/secrets/migrator_db_client_key_pk8}
  bao_tls_crt:                {file: ./infra/secrets/bao_tls_crt}
  bao_tls_key:                {file: ./infra/secrets/bao_tls_key}
  app_bao_client_crt:         {file: ./infra/secrets/app_bao_client_crt}
  app_bao_client_key:         {file: ./infra/secrets/app_bao_client_key}
  bao_admin_client_crt:       {file: ./infra/secrets/bao_admin_client_crt}
  bao_admin_client_key:       {file: ./infra/secrets/bao_admin_client_key}
  bao_health_client_crt:      {file: ./infra/secrets/bao_health_client_crt}
  bao_health_client_key:      {file: ./infra/secrets/bao_health_client_key}
  web_provider_tls_crt:       {file: ./infra/secrets/web_provider_tls_crt}
  web_provider_tls_key:       {file: ./infra/secrets/web_provider_tls_key}
  payment_sim_tls_crt:        {file: ./infra/secrets/payment_sim_tls_crt}
  payment_sim_tls_key:        {file: ./infra/secrets/payment_sim_tls_key}
  payment_sim_client_crt:     {file: ./infra/secrets/payment_sim_client_crt}
  payment_sim_client_key:     {file: ./infra/secrets/payment_sim_client_key}
  app_provider_client_crt:    {file: ./infra/secrets/app_provider_client_crt}
  app_provider_client_key:    {file: ./infra/secrets/app_provider_client_key}

volumes:
  db-data:
  bao-data:      # OpenBao storage (Raft), encrypted by its barrier key
  bao-audit:     # OpenBao audit log
  bao-keys:      # development custody of the unseal shares (ADR-018)
  audit-checkpoints:  # signed audit checkpoint files; the auditor copies them off-host (ADR-007)
  document-data: # uploaded document files under random keys (ADR-033), mounted into the app only
  map-data:      # map tile archives and manifests (ADR-029), written only by maps-install
  map-sources:   # downloaded map sources (OSM extract, water polygons, glyphs), profile "maps"
  map-work:      # map build workspace and staged archives, profile "maps"
